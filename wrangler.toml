name = "creators-desk"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[assets]
directory = "./dist"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "creators-desk-db"
database_id = "35ac78cd-1380-463b-80fc-84cbe09695ff"

# Cloudflare R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "creators-desk-vaults"
