<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Zoom is left enabled: blocking it makes the editor unusable for anyone
         who needs to magnify. `resizes-content` makes the on-screen keyboard
         resize the layout viewport so CodeMirror is never hidden behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Creators Desk</title>
  </head>

    <div id="root"></div>

  </body>
